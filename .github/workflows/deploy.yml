name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Datenbank-Änderungen (supabase/migrations) und Edge Function einspielen —
  #    IMMER vor der neuen App, damit die App nie neuer ist als die Datenbank.
  #    Braucht die Repo-Secrets SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD
  #    sowie die Repo-Variable SUPABASE_PROJECT_REF.
  datenbank:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Zugangsdaten prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Supabase-Zugangsdaten fehlen (Secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, Variable SUPABASE_PROJECT_REF). Ohne sie wird nichts ausgeliefert, damit App und Datenbank nicht auseinanderlaufen."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Datenbank-Migrationen einspielen
        run: supabase db push --include-all
      - name: Edge Function baulog-ai ausliefern
        run: supabase functions deploy baulog-ai --project-ref "$PROJECT_REF"

  build:
    needs: datenbank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
