name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Datenbank-Änderungen (supabase/migrations) und Edge Function einspielen —
  #    IMMER vor der neuen App, damit die App nie neuer ist als die Datenbank.
  #    Braucht die Repo-Secrets SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD
  #    sowie die Repo-Variable SUPABASE_PROJECT_REF.
  datenbank:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Zugangsdaten prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Supabase-Zugangsdaten fehlen (Secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, Variable SUPABASE_PROJECT_REF). Ohne sie wird nichts ausgeliefert, damit App und Datenbank nicht auseinanderlaufen."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Ohne "supabase link": der braucht mehr Token-Rechte als nötig.
      # Verbindung über den Supabase-Pooler (GitHub-Runner haben kein IPv6).
      # Kostenlose Supabase-Projekte pausieren nach ca. 1 Woche ohne Nutzung → hier automatisch aufwecken
      - name: Supabase-Projekt aufwecken (falls pausiert)
        run: |
          status() { curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.status // "unbekannt"'; }
          S=$(status); echo "Projektstatus: $S"
          if [ "$S" = "INACTIVE" ] || [ "$S" = "PAUSED" ]; then
            CODE=$(curl -s -o /tmp/restore.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/restore")
            echo "Aufwecken angefordert: HTTP $CODE $(head -c 200 /tmp/restore.json)"
            if [ "$CODE" -ge 300 ]; then
              echo "::error::Supabase-Projekt ist pausiert und liess sich nicht automatisch aufwecken (HTTP $CODE). Bitte im Dashboard „Restore project“ wählen: https://supabase.com/dashboard/project/$PROJECT_REF"
              exit 1
            fi
          fi
          # warten, bis Datenbank und Pooler bereit sind (max. 15 Min.)
          for i in $(seq 1 90); do
            S=$(status)
            [ "$S" = "ACTIVE_HEALTHY" ] && break
            echo "… $S"; sleep 10
          done
          echo "Projektstatus: $S"
          if [ "$S" != "ACTIVE_HEALTHY" ]; then echo "::error::Supabase-Projekt ist nicht bereit (Status $S)."; exit 1; fi
          # Pooler-Konfiguration erscheint teils erst kurz nach dem Aufwachen
          for i in $(seq 1 18); do
            N=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler" | jq 'if type=="array" then length else 1 end')
            [ "$N" != "0" ] && break
            echo "… Pooler noch nicht bereit"; sleep 10
          done

      - name: Datenbank-Verbindung ermitteln
        run: |
          RES=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler")
          CODE=$(echo "$RES" | tail -n1); POOLER=$(echo "$RES" | sed '$d')
          echo "Supabase-API: HTTP $CODE"
          if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "::error::Supabase lehnt den Zugang ab (HTTP $CODE): Das Repo-Secret SUPABASE_ACCESS_TOKEN ist abgelaufen oder ungültig. Neuen Token unter https://supabase.com/dashboard/account/tokens erzeugen und unter GitHub → Settings → Secrets → Actions → SUPABASE_ACCESS_TOKEN eintragen."
            exit 1
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase-API antwortet mit HTTP $CODE (Projekt $PROJECT_REF): $(echo "$POOLER" | head -c 300)"
            exit 1
          fi
          # Antwort kann eine Liste (mehrere Pooler) oder ein einzelnes Objekt sein
          WAHL='if type=="array" then (([.[] | select(.database_type=="PRIMARY")][0]) // .[0]) else . end'
          HOST=$(echo "$POOLER" | jq -r "$WAHL | .db_host // empty")
          DBUSER=$(echo "$POOLER" | jq -r "$WAHL | .db_user // empty")
          if [ -z "$HOST" ] || [ -z "$DBUSER" ]; then
            # Projektstatus prüfen: pausierte Projekte haben keinen Pooler
            PROJ=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF")
            STATUS=$(echo "$PROJ" | jq -r '.status // "unbekannt"'); REGION=$(echo "$PROJ" | jq -r '.region // "?"')
            echo "Pooler-Liste leer — Projektstatus: $STATUS, Region: $REGION"
            if [ "$STATUS" = "INACTIVE" ] || [ "$STATUS" = "PAUSED" ] || [ "$STATUS" = "PAUSING" ]; then
              echo "::error::Das Supabase-Projekt $PROJECT_REF ist noch pausiert. Im Dashboard „Restore project“ wählen: https://supabase.com/dashboard/project/$PROJECT_REF"
              exit 1
            fi
            # sonst: Verbindung über „supabase link“ ermitteln lassen (offizieller Weg der CLI)
            echo "DB_LINK=1" >> "$GITHUB_ENV"
            exit 0
          fi
          PW=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PW"
          echo "DB_URL=postgresql://$DBUSER:$PW@$HOST:5432/postgres" >> "$GITHUB_ENV"
          echo "Pooler: $HOST ($DBUSER)"
      - name: Datenbank-Migrationen einspielen
        run: |
          if [ "$DB_LINK" = "1" ]; then
            supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
            supabase db push --linked --include-all -p "$SUPABASE_DB_PASSWORD"
          else
            # direkt nach dem Aufwecken weist die Datenbank Verbindungen kurz ab → bis zu 5 Versuche
            for i in 1 2 3 4 5; do
              supabase db push --db-url "$DB_URL" --include-all && exit 0
              echo "Versuch $i fehlgeschlagen — warte 20 s"; sleep 20
            done
            exit 1
          fi
      - name: Edge Function baulog-ai ausliefern
        run: supabase functions deploy baulog-ai --project-ref "$PROJECT_REF" --use-api
      - name: Edge Function rapport-versand ausliefern
        run: supabase functions deploy rapport-versand --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Edge Function rapport-signatur ausliefern
        run: supabase functions deploy rapport-signatur --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Edge Function rapport-stempel ausliefern
        run: supabase functions deploy rapport-stempel --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

  build:
    needs: datenbank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Offizielle Quellensteuer-Tabellen der ESTV (Löhne) für die Rapport-App — nicht fatal:
      # fehlen sie, lädt die App die zuletzt gespeicherte Tabelle bzw. weist auf den fehlenden Satz hin.
      - name: Quellensteuer-Tabellen holen
        continue-on-error: true
        run: |
          J=$(date +%Y)
          python3 rapport/scripts/qst-tarife.py "$J" || echo "::warning::Quellensteuer-Tabellen $J konnten nicht geladen werden"
          # ab Dezember sind meist schon die Tabellen fürs neue Jahr veröffentlicht
          python3 rapport/scripts/qst-tarife.py "$((J + 1))" >/dev/null 2>&1 && echo "Tabellen $((J + 1)) ebenfalls geladen" || echo "Tabellen $((J + 1)) noch nicht veröffentlicht"
          du -sh rapport/public/qst 2>/dev/null || true
      # Zweite App „Rapport" (Arbeitszeit/Wochenrapport) → /baulog/rapport/
      - name: Rapport-App bauen
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci --prefix rapport
          npm run build --prefix rapport
          cp -r rapport/dist dist/rapport
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
