# Minimal-Konfiguration für die Supabase CLI (Migrationen + Edge Functions per GitHub Actions)
project_id = "baulog"

[functions.baulog-ai]
verify_jwt = true

# Rapport-App: Versand über Microsoft Graph. Kein JWT nötig — ohne gültigen Microsoft-Token des Nutzers passiert nichts.
[functions.rapport-versand]
verify_jwt = false

# Rapport-App: Polier unterschreibt per QR-Code ohne Konto (Zugriff nur mit zufälligem Token).
[functions.rapport-signatur]
verify_jwt = false
